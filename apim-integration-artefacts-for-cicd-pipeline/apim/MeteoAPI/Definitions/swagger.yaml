openapi: 3.0.1
info:
  title: MeteoAPI
  version: 1.0.0
servers:
 -
  url: /
security:
 -
  default: []
paths:
  /forecast:
    get:
      parameters:
       -
        name: latitude
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: number
          example: 49.83465
       -
        name: longitude
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: number
          example: 18.28204
       -
        name: current
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: temperature_2m,relative_humidity_2m,weather_code,windspeed,winddirection
      responses:
        "200":
          description: ok
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
components:
  securitySchemes:
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://test.com
          scopes: {}
x-wso2-api-key-header: ApiKey
x-wso2-auth-header: Authorization
x-wso2-cors:
  corsConfigurationEnabled: false
  accessControlAllowOrigins:
   - '*'
  accessControlAllowCredentials: false
  accessControlAllowHeaders:
   - authorization
   - Access-Control-Allow-Origin
   - Content-Type
   - SOAPAction
   - apikey
   - Internal-Key
  accessControlAllowMethods:
   - GET
   - PUT
   - POST
   - DELETE
   - PATCH
   - OPTIONS
x-wso2-production-endpoints:
  urls:
   - https://api.open-meteo.com/v1
  type: http
x-wso2-sandbox-endpoints:
  urls:
   - https://api.open-meteo.com/v1
  type: http
x-wso2-basePath: /MeteoAPI/1.0.0
x-wso2-transports:
 - http
 - https
x-wso2-application-security:
  security-types:
   - oauth2
  optional: false
x-wso2-response-cache:
  enabled: false
  cacheTimeoutInSeconds: 300
