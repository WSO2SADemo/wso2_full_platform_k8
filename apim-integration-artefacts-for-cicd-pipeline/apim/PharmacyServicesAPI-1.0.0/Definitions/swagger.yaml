openapi: 3.0.3
info:
  title: PharmacyServicesAPI
  description: "Pharmacy management, medication inventory, prescription dispensing, and dispense history. Runs on port 9202."
  version: 1.0.0
servers:
 -
  url: http://localhost:9202
  description: Local mock backend
security:
 -
  default: []
tags:
 -
  name: Pharmacies
 -
  name: Medications
 -
  name: Dispense
paths:
  /pharmacy/health:
    get:
      tags:
       - Pharmacies
      summary: Health check
      operationId: getPharmacyHealth
      responses:
        "200":
          description: Service status message
          content:
            text/plain:
              schema:
                type: string
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
  /pharmacy/pharmacies:
    get:
      tags:
       - Pharmacies
      summary: List all pharmacies
      operationId: listPharmacies
      responses:
        "200":
          description: Array of pharmacies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pharmacy"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
    post:
      tags:
       - Pharmacies
      summary: Create a pharmacy
      operationId: createPharmacy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pharmacy"
        required: true
      responses:
        "201":
          description: Pharmacy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pharmacy"
        "409":
          description: Pharmacy already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
       -
        default:
         - restricted
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
  /pharmacy/pharmacies/{pharmacyId}:
    get:
      tags:
       - Pharmacies
      summary: Get a pharmacy by ID
      operationId: getPharmacy
      responses:
        "200":
          description: Pharmacy record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pharmacy"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
    put:
      tags:
       - Pharmacies
      summary: Update a pharmacy
      operationId: updatePharmacy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pharmacy"
        required: true
      responses:
        "200":
          description: Updated pharmacy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pharmacy"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
       -
        default:
         - restricted
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
    delete:
      tags:
       - Pharmacies
      summary: Delete a pharmacy
      operationId: deletePharmacy
      responses:
        "200":
          description: Deletion confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
       -
        default:
         - restricted
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
    parameters:
     -
      $ref: "#/components/parameters/pharmacyId"
  /pharmacy/medications:
    get:
      tags:
       - Medications
      summary: List all medications
      operationId: listMedications
      responses:
        "200":
          description: Array of medications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Medication"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
    post:
      tags:
       - Medications
      summary: Add a medication
      operationId: createMedication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Medication"
        required: true
      responses:
        "201":
          description: Medication created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"
        "409":
          description: Medication already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
       -
        default:
         - restricted
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
  /pharmacy/medications/{medicationId}:
    get:
      tags:
       - Medications
      summary: Get a medication by ID
      operationId: getMedication
      responses:
        "200":
          description: Medication record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
    put:
      tags:
       - Medications
      summary: Update a medication
      operationId: updateMedication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Medication"
        required: true
      responses:
        "200":
          description: Updated medication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
    delete:
      tags:
       - Medications
      summary: Delete a medication
      operationId: deleteMedication
      responses:
        "200":
          description: Deletion confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
    parameters:
     -
      $ref: "#/components/parameters/medicationId"
  /pharmacy/medications/search:
    get:
      tags:
       - Medications
      summary: Search medications by name or category
      operationId: searchMedications
      parameters:
       -
        name: query
        in: query
        description: Name or generic name substring to search
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: category
        in: query
        description: Filter by medication category
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: requiresPrescription
        in: query
        description: Filter by prescription requirement
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      responses:
        "200":
          description: Matching medications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Medication"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
  /pharmacy/dispense:
    post:
      tags:
       - Dispense
      summary: Dispense a prescription
      operationId: dispensePrescription
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispenseRequest"
        required: true
      responses:
        "200":
          description: Dispense confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispenseResponse"
        "400":
          description: Prescription not found or already dispensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Insufficient stock for one or more medications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
  /pharmacy/dispense/history:
    get:
      tags:
       - Dispense
      summary: List all dispense records
      operationId: listDispenseHistory
      responses:
        "200":
          description: Array of dispense records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DispenseRecord"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
  /pharmacy/dispense/history/{dispenseId}:
    get:
      tags:
       - Dispense
      summary: Get a dispense record by ID
      operationId: getDispenseRecord
      responses:
        "200":
          description: Dispense record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispenseRecord"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
    parameters:
     -
      $ref: "#/components/parameters/dispenseId"
  /pharmacy/dispense/patient/{patientId}:
    get:
      tags:
       - Dispense
      summary: List dispense history for a patient
      operationId: listDispenseHistoryByPatient
      responses:
        "200":
          description: Array of dispense records for the patient
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DispenseRecord"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
    parameters:
     -
      $ref: "#/components/parameters/patientId"
  /pharmacy/dispense/prescription/{prescriptionId}:
    get:
      tags:
       - Dispense
      summary: Get dispense record for a prescription
      operationId: getDispenseByPrescription
      responses:
        "200":
          description: Dispense record for the prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispenseRecord"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
    parameters:
     -
      $ref: "#/components/parameters/prescriptionId"
components:
  schemas:
    Pharmacy:
      required:
       - address
       - city
       - isActive
       - licenseNumber
       - name
       - operatingHours
       - pharmacyId
       - phone
      type: object
      properties:
        pharmacyId:
          type: string
          example: PH001
        name:
          type: string
          example: City Central Pharmacy
        address:
          type: string
          example: 45 Hospital Road
        city:
          type: string
          example: Colombo
        phone:
          type: string
          example: "+94112345679"
        operatingHours:
          type: string
          example: Mon-Sat 08:00-20:00
        licenseNumber:
          type: string
          example: LIC-PH-2024-001
        isActive:
          type: boolean
          example: true
    Medication:
      required:
       - category
       - form
       - genericName
       - manufacturer
       - medicationId
       - name
       - requiresPrescription
       - stockQuantity
       - strength
      type: object
      properties:
        medicationId:
          type: string
          example: MED001
        name:
          type: string
          example: Glucophage
        genericName:
          type: string
          example: Metformin
        category:
          type: string
          example: Antidiabetic
        form:
          type: string
          enum:
           - TABLET
           - CAPSULE
           - LIQUID
           - INJECTION
        strength:
          type: string
          example: 500mg
        requiresPrescription:
          type: boolean
          example: true
        stockQuantity:
          type: integer
          example: 500
        manufacturer:
          type: string
          example: Bristol-Myers Squibb
    DispenseRequest:
      required:
       - patientId
       - pharmacyId
       - prescriptionId
      type: object
      properties:
        prescriptionId:
          type: string
          example: RX001
        patientId:
          type: string
          example: P001
        pharmacyId:
          type: string
          example: PH001
    DispenseResponse:
      required:
       - dispenseId
       - dispensedAt
       - message
       - prescriptionId
       - success
      type: object
      properties:
        success:
          type: boolean
          example: true
        dispenseId:
          type: string
          example: DSP-RX001-PH001
        prescriptionId:
          type: string
          example: RX001
        dispensedAt:
          type: string
          example: 2026-03-21T10:00:00
        message:
          type: string
          example: Prescription dispensed successfully
    DispenseRecord:
      required:
       - dispenseId
       - dispensedAt
       - dispensedBy
       - items
       - patientId
       - pharmacyId
       - pharmacyName
       - prescriptionId
       - totalCost
      type: object
      properties:
        dispenseId:
          type: string
          example: DSP-RX001-PH001
        prescriptionId:
          type: string
          example: RX001
        patientId:
          type: string
          example: P001
        pharmacyId:
          type: string
          example: PH001
        pharmacyName:
          type: string
          example: City Central Pharmacy
        dispensedAt:
          type: string
          example: 2026-03-21T10:00:00
        dispensedBy:
          type: string
          example: Pharmacist Sarah Lee
        items:
          type: array
          items:
            $ref: "#/components/schemas/DispensedItem"
        totalCost:
          type: number
          format: float
          example: 45.5
    DispensedItem:
      required:
       - medicationId
       - medicationName
       - quantityDispensed
       - unitCost
      type: object
      properties:
        medicationId:
          type: string
          example: MED001
        medicationName:
          type: string
          example: Glucophage 500mg
        quantityDispensed:
          type: integer
          example: 60
        unitCost:
          type: number
          format: float
          example: 0.75
    ErrorResponse:
      required:
       - code
       - message
      type: object
      properties:
        code:
          type: string
          example: MEDICATION_NOT_FOUND
        message:
          type: string
          example: Medication MED001 not found
    DeleteResponse:
      required:
       - message
       - success
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Pharmacy PH001 deleted
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    pharmacyId:
      name: pharmacyId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
    medicationId:
      name: medicationId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
    dispenseId:
      name: dispenseId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
    patientId:
      name: patientId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
    prescriptionId:
      name: prescriptionId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
  securitySchemes:
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://test.com
          scopes:
            restricted: ""
          x-scopes-bindings:
            restricted: ""
x-wso2-api-key-header: ApiKey
x-wso2-auth-header: Authorization
x-wso2-cors:
  corsConfigurationEnabled: false
  accessControlAllowOrigins:
   - '*'
  accessControlAllowCredentials: false
  accessControlAllowHeaders:
   - authorization
   - Access-Control-Allow-Origin
   - Content-Type
   - SOAPAction
  accessControlAllowMethods:
   - GET
   - PUT
   - POST
   - DELETE
   - PATCH
   - OPTIONS
x-wso2-production-endpoints:
  urls:
   - http://medical-provider-services.ballerina.svc.cluster.local:9202
  type: http
x-wso2-sandbox-endpoints:
  urls:
   - http://medical-provider-services.ballerina.svc.cluster.local:9202
  type: http
x-wso2-basePath: /pharmacyservicesapi/1.0.0
x-wso2-transports:
 - http
 - https
x-wso2-application-security:
  security-types:
   - oauth2
  optional: false
x-wso2-response-cache:
  enabled: false
  cacheTimeoutInSeconds: 300
