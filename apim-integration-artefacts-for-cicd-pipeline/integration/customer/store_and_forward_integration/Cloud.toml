[container.image]
repository = "ramilu90"
name = "store_and_forward_integration"
tag = "1.0.11"


[[cloud.secret.envs]]
key_ref="RABBITMQ_USER"
secret_name="rabbitmq-credentials"

[[cloud.secret.envs]]
key_ref="RABBITMQ_PASSWORD"
secret_name="rabbitmq-credentials"

[[cloud.config.envs]]
key_ref="BAL_CONFIG_DATA"
config_name="ballerina-values-store-and-forward"

[[cloud.config.envs]]
key_ref="rabbitmqHost"
config_name="ballerina-values-store-and-forward"

[[cloud.config.envs]]
key_ref="rabbitmqPort"
config_name="ballerina-values-store-and-forward"

[[cloud.config.envs]]
key_ref="backendUrl"
config_name="ballerina-values-store-and-forward"