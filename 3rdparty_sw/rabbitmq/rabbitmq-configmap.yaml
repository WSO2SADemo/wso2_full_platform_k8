apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: rabbitmq
data:
  rabbitmq.conf: |
    # Networking
    listeners.tcp.default = 5672

    # Management plugin
    management.tcp.port = 15672
    management.tcp.ip   = 0.0.0.0

    # Logging
    log.console          = true
    log.console.level    = info

    # Resource limits (suitable for a single-node demo)
    vm_memory_high_watermark.relative = 0.6
    disk_free_limit.absolute          = 1GB

    # Allow guest login from any host (demo only – restrict in production)
    loopback_users = none

  enabled_plugins: |
    [rabbitmq_management,rabbitmq_management_agent,rabbitmq_prometheus].
