apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
  labels:
    k8s-app: kube-dns
data:
  wso2.server: |
    wso2.com:53 {
        errors
        cache 30
        hosts {
            # IAM / Identity Server
            10.43.174.18 is.wso2.com
            
            # APIM Control Plane
            10.43.78.159 cp.wso2.com
            
            # APIM Gateways & Analytics
            10.43.234.94 gw.wso2.com icp.wso2.com extgw.wso2.com kibana.wso2.com
            
            fallthrough
        }
        forward . 8.8.8.8 1.1.1.1 
        reload
    }
