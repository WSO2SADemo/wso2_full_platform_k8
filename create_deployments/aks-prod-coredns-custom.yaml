apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
  labels:
    k8s-app: kube-dns
data:
  wso2.server: |
    wso2.com:53 {
        errors
        cache 30
        hosts {
            # Point EVERYTHING to the Nginx Ingress CLUSTER-IP (10.0.119.125)
            10.0.119.125 is.wso2.com
            10.0.119.125 cp.wso2.com
            10.0.119.125 gw.wso2.com
            10.0.119.125 icp.wso2.com
            10.0.119.125 extgw.wso2.com
            10.0.119.125 kibana.wso2.com
            10.0.119.125 rabbitmq.wso2.com
            
            fallthrough
        }
        forward . 8.8.8.8 1.1.1.1 
        reload
    }
