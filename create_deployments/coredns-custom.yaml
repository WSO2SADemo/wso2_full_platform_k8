apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
  labels:
    k8s-app: kube-dns
data:
  wso2.server: |
    wso2.com:53 {
        errors
        cache 30
        hosts {
            # Point EVERYTHING to the Nginx Ingress Controller IP (20.198.137.115)
            20.198.137.115 is.wso2.com
            20.198.137.115 cp.wso2.com
            20.198.137.115 gw.wso2.com
            20.198.137.115 icp.wso2.com
            20.198.137.115 extgw.wso2.com
            20.198.137.115 kibana.wso2.com
            20.198.137.115 rabbitmq.wso2.com
            
            fallthrough
        }
        forward . 8.8.8.8 1.1.1.1 
        reload
    }
