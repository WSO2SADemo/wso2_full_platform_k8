server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Reverse-proxy Identity Server OIDC endpoints ──────────────
    # The Asgardeo SDK runs in the browser and needs to call the IS
    # token / userinfo / jwks endpoints.  Proxying through nginx
    # avoids self-signed-cert and CORS issues (same-origin fetch).
    location ^~ /is/ {
        proxy_pass          https://identity-server:9444/;
        proxy_ssl_verify    off;
        proxy_set_header    Host              localhost:9444;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_buffer_size   16k;
        proxy_buffers       4 32k;
    }

    # ── Reverse-proxy Admin Agent (direct invocation with in-agent JWT validation) ──
    # Proxying through nginx avoids CORS issues (same-origin fetch)
    location ^~ /ai/ {
        proxy_pass          http://admin-agent:9095/ai/;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Authorization     $http_authorization;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffer_size   16k;
        proxy_buffers       4 32k;
    }

    # ── Reverse-proxy CS Agent (direct invocation with in-agent JWT validation) ──
    # Same pattern as AI Agent — bypasses APIM so the user's JWT is preserved
    location ^~ /cs/ {
        proxy_pass          http://cs-agent:9097/cs/;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Authorization     $http_authorization;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffer_size   16k;
        proxy_buffers       4 32k;
    }

    # Runtime auth config — injected by create_apis.sh, must never be cached
    location = /auth-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA fallback — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caching for Vite-hashed static assets (NOT auth-config.js)
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JS files (Vite hashed) — cache, but auth-config.js is excluded above
    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
