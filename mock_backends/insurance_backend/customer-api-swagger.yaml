# Insurance Customer API - OpenAPI Specification

openapi: 3.0.0
info:
  title: Insurance Customer API
  description: Customer-facing API for insurance policy and claims management
  version: 1.0.0
  contact:
    name: Insurance Backend Team

servers:
  - url: http://localhost:8082
    description: Local development server

paths:
  /insurance/customer/policy:
    post:
      summary: Get policy details by username
      description: Retrieves insurance policy information for a specific user
      operationId: getPolicy
      tags:
        - Policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameRequest'
            examples:
              example1:
                summary: Get policy for john_doe
                value:
                  username: "john_doe"
              example2:
                summary: Get policy for emma_premier
                value:
                  username: "emma_premier"
      responses:
        '200':
          description: Policy details retrieved successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PolicyResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                success:
                  summary: Successful policy retrieval
                  value:
                    policyNumber: "POL-HEALTH-001"
                    policyType: "HEALTH"
                    coverageAmount: 100000.00
                    premiumAmount: 120.00
                    startDate: "2024-01-01"
                    endDate: "2025-01-01"
                    status: "ACTIVE"
                error:
                  summary: Policy not found
                  value:
                    message: "No policy found for username: unknown_user"
                    errorCode: null

  /insurance/customer/claims:
    post:
      summary: Get claims list by username
      description: Retrieves all claims submitted by a specific user
      operationId: getClaims
      tags:
        - Claims
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameRequest'
            examples:
              example1:
                summary: Get claims for john_doe
                value:
                  username: "john_doe"
              example2:
                summary: Get claims for alex_cashier
                value:
                  username: "alex_cashier"
      responses:
        '200':
          description: Claims list retrieved successfully
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Claim'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                success:
                  summary: Successful claims retrieval
                  value:
                    - claimId: "CLM-001"
                      claimType: "Hospitalization"
                      amount: 3200.00
                      description: "Emergency appendix surgery"
                      submittedDate: "2024-03-10"
                      status: "APPROVED"
                    - claimId: "CLM-002"
                      claimType: "Outpatient"
                      amount: 450.00
                      description: "Specialist consultation and lab tests"
                      submittedDate: "2024-05-22"
                      status: "PENDING"
                emptyClaims:
                  summary: No claims found
                  value: []
                error:
                  summary: Policy not found
                  value:
                    message: "No policy found for username: unknown_user"
                    errorCode: null

  /insurance/customer/claims/submit:
    post:
      summary: Submit a new claim
      description: Submits a new insurance claim for processing
      operationId: submitClaim
      tags:
        - Claims
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimSubmitRequest'
            examples:
              hospitalization:
                summary: Hospitalization claim
                value:
                  username: "john_doe"
                  claimType: "Hospitalization"
                  amount: 5000.00
                  description: "Emergency medical procedure"
              outpatient:
                summary: Outpatient claim
                value:
                  username: "emma_premier"
                  claimType: "Outpatient"
                  amount: 250.00
                  description: "Routine checkup"
      responses:
        '200':
          description: Claim submission response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                success:
                  summary: Claim submitted successfully
                  value:
                    message: "Claim CLM-1234567890 submitted successfully and is under review"
                    success: true
                policyNotFound:
                  summary: Policy not found
                  value:
                    message: "No policy found for username: unknown_user"
                    errorCode: null
                inactivePolicy:
                  summary: Inactive policy
                  value:
                    message: "Cannot submit claim. Policy status is: EXPIRED"
                    errorCode: null

components:
  schemas:
    UsernameRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          description: Username of the policy holder
          example: "john_doe"

    ClaimSubmitRequest:
      type: object
      required:
        - username
        - claimType
        - amount
        - description
      properties:
        username:
          type: string
          description: Username of the policy holder
          example: "john_doe"
        claimType:
          type: string
          description: Type of claim being submitted
          example: "Hospitalization"
        amount:
          type: number
          format: decimal
          description: Claim amount
          minimum: 0
          example: 5000.00
        description:
          type: string
          description: Description of the claim
          minLength: 1
          example: "Emergency medical procedure"

    PolicyResponse:
      type: object
      required:
        - policyNumber
        - policyType
        - coverageAmount
        - premiumAmount
        - startDate
        - endDate
        - status
      properties:
        policyNumber:
          type: string
          description: Unique policy identifier
          example: "POL-HEALTH-001"
        policyType:
          type: string
          description: Type of insurance policy
          enum: [HEALTH, LIFE, AUTO, HOME]
          example: "HEALTH"
        coverageAmount:
          type: number
          format: decimal
          description: Total coverage amount
          example: 100000.00
        premiumAmount:
          type: number
          format: decimal
          description: Premium amount
          example: 120.00
        startDate:
          type: string
          format: date
          description: Policy start date
          example: "2024-01-01"
        endDate:
          type: string
          format: date
          description: Policy end date
          example: "2025-01-01"
        status:
          type: string
          description: Current policy status
          enum: [ACTIVE, EXPIRED, SUSPENDED]
          example: "ACTIVE"

    Claim:
      type: object
      required:
        - claimId
        - claimType
        - amount
        - description
        - submittedDate
        - status
      properties:
        claimId:
          type: string
          description: Unique claim identifier
          example: "CLM-001"
        claimType:
          type: string
          description: Type of claim
          example: "Hospitalization"
        amount:
          type: number
          format: decimal
          description: Claim amount
          example: 3200.00
        description:
          type: string
          description: Claim description
          example: "Emergency appendix surgery"
        submittedDate:
          type: string
          format: date
          description: Date claim was submitted
          example: "2024-03-10"
        status:
          type: string
          description: Current claim status
          enum: [PENDING, APPROVED, REJECTED]
          example: "APPROVED"

    SuccessResponse:
      type: object
      required:
        - message
        - success
      properties:
        message:
          type: string
          description: Success message
          example: "Operation completed successfully"
        success:
          type: boolean
          description: Success indicator (always true)
          enum: [true]
          example: true

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message
          example: "No policy found for username: unknown_user"
        errorCode:
          type: string
          nullable: true
          description: Optional error code
          example: null

tags:
  - name: Policy
    description: Policy management operations for customers
  - name: Claims
    description: Claims management operations for customers