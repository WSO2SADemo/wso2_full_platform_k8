# Insurance Agent API - OpenAPI Specification

openapi: 3.0.0
info:
  title: Insurance Agent API
  description: Agent-facing API for managing insurance policies and administrative operations
  version: 1.0.0
  contact:
    name: Insurance Backend Team

servers:
  - url: http://localhost:8083
    description: Local development server

paths:
  /insurance/agent/policies:
    get:
      summary: List all policies
      description: Retrieves a complete list of all insurance policies in the system
      operationId: listPolicies
      tags:
        - Policy Management
      responses:
        '200':
          description: List of all policies retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InsurancePolicy'
              examples:
                success:
                  summary: Multiple policies
                  value:
                    - username: "john_doe"
                      policyNumber: "POL-HEALTH-001"
                      policyType: "HEALTH"
                      coverageAmount: 100000.00
                      premiumAmount: 120.00
                      startDate: "2024-01-01"
                      endDate: "2025-01-01"
                      status: "ACTIVE"
                    - username: "emma_premier"
                      policyNumber: "POL-HEALTH-002"
                      policyType: "HEALTH"
                      coverageAmount: 500000.00
                      premiumAmount: 350.00
                      startDate: "2024-01-01"
                      endDate: "2025-01-01"
                      status: "ACTIVE"
                    - username: "alex_cashier"
                      policyNumber: "POL-AUTO-001"
                      policyType: "AUTO"
                      coverageAmount: 50000.00
                      premiumAmount: 80.00
                      startDate: "2024-03-01"
                      endDate: "2025-03-01"
                      status: "ACTIVE"
                    - username: "sarah_williams"
                      policyNumber: "POL-HOME-001"
                      policyType: "HOME"
                      coverageAmount: 250000.00
                      premiumAmount: 95.00
                      startDate: "2023-06-01"
                      endDate: "2024-06-01"
                      status: "EXPIRED"
                    - username: "michael_brown"
                      policyNumber: "POL-LIFE-001"
                      policyType: "LIFE"
                      coverageAmount: 1000000.00
                      premiumAmount: 200.00
                      startDate: "2024-01-15"
                      endDate: "2044-01-15"
                      status: "ACTIVE"

  /insurance/agent/policy/update:
    post:
      summary: Update policy status
      description: Updates the status of an insurance policy (e.g., ACTIVE, EXPIRED, SUSPENDED)
      operationId: updatePolicyStatus
      tags:
        - Policy Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdateRequest'
            examples:
              suspendPolicy:
                summary: Suspend a policy
                value:
                  policyNumber: "POL-HEALTH-001"
                  status: "SUSPENDED"
              activatePolicy:
                summary: Activate a policy
                value:
                  policyNumber: "POL-HEALTH-001"
                  status: "ACTIVE"
              expirePolicy:
                summary: Expire a policy
                value:
                  policyNumber: "POL-HOME-001"
                  status: "EXPIRED"
      responses:
        '200':
          description: Policy update response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                success:
                  summary: Policy updated successfully
                  value:
                    message: "Policy POL-HEALTH-001 updated to status: SUSPENDED"
                    success: true
                notFound:
                  summary: Policy not found
                  value:
                    message: "Policy not found: POL-UNKNOWN-999"
                    errorCode: null

components:
  schemas:
    InsurancePolicy:
      type: object
      required:
        - username
        - policyNumber
        - policyType
        - coverageAmount
        - premiumAmount
        - startDate
        - endDate
        - status
      properties:
        username:
          type: string
          description: Username of the policy holder
          example: "john_doe"
        policyNumber:
          type: string
          description: Unique policy identifier
          example: "POL-HEALTH-001"
        policyType:
          type: string
          description: Type of insurance policy
          enum: [HEALTH, LIFE, AUTO, HOME]
          example: "HEALTH"
        coverageAmount:
          type: number
          format: decimal
          description: Total coverage amount
          minimum: 0
          example: 100000.00
        premiumAmount:
          type: number
          format: decimal
          description: Premium amount
          minimum: 0
          example: 120.00
        startDate:
          type: string
          format: date
          description: Policy start date
          example: "2024-01-01"
        endDate:
          type: string
          format: date
          description: Policy end date
          example: "2025-01-01"
        status:
          type: string
          description: Current policy status
          enum: [ACTIVE, EXPIRED, SUSPENDED]
          example: "ACTIVE"

    PolicyUpdateRequest:
      type: object
      required:
        - policyNumber
        - status
      properties:
        policyNumber:
          type: string
          description: Policy number to update
          example: "POL-HEALTH-001"
        status:
          type: string
          description: New policy status
          enum: [ACTIVE, EXPIRED, SUSPENDED]
          example: "SUSPENDED"

    SuccessResponse:
      type: object
      required:
        - message
        - success
      properties:
        message:
          type: string
          description: Success message
          example: "Operation completed successfully"
        success:
          type: boolean
          description: Success indicator (always true)
          enum: [true]
          example: true

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message
          example: "Policy not found"
        errorCode:
          type: string
          nullable: true
          description: Optional error code for additional error context
          example: null

tags:
  - name: Policy Management
    description: Administrative operations for managing insurance policies

