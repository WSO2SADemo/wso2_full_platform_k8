---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  labels:
    app: "insurance_backend"
  name: "insurance-backend-deployment"
  namespace: "ballerina"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "insurance_backend"
  template:
    metadata:
      labels:
        app: "insurance_backend"
    spec:
      containers:
      - image: "ramilu90/insurance_backend:1.0.0"
        lifecycle:
          preStop:
            exec:
              command:
              - "sleep"
              - "15"
        name: "insurance-backend-deployment"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "100Mi"
            cpu: "200m"
---
apiVersion: "v1"
kind: "Service"
metadata:
  labels:
    app: "insurance_backend"
  name: "insurance-backend-svc"
  namespace: "ballerina"
spec:
  ports:
  - name: "customer-port"
    port: 8082
    protocol: "TCP"
    targetPort: 8082
  - name: "agent-port"
    port: 8083
    protocol: "TCP"
    targetPort: 8083
  selector:
    app: "insurance_backend"
---
apiVersion: "autoscaling/v2"
kind: "HorizontalPodAutoscaler"
metadata:
  labels:
    app: "insurance_backend"
  name: "insurance-backend-hpa"
  namespace: "ballerina"
spec:
  maxReplicas: 1
  metrics:
  - resource:
      name: "cpu"
      target:
        averageUtilization: 50
        type: "Utilization"
    type: "Resource"
  minReplicas: 1
  scaleTargetRef:
    apiVersion: "apps/v1"
    kind: "Deployment"
    name: "insurance-backend-deployment"


