name: Integration - Mock Backends

on:
  push:
    paths:
      - 'mock_backends/customer_mock_backend/**'
      - '.github/workflows/customer_mock_backends-ci.yml'
    branches:
      - main

  # Allows manual triggering
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
      BALLERINA_NAMESPACE: ballerina
      PROJECT_DIR: mock_backends/customer_mock_backend
      # Must match Cloud.toml [container.image].tag
      IMAGE_TAG: "1.0.19"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Debug - Print Environment Variables
        run: |
          echo "Current Working Directory: $(pwd)"
          echo "PROJECT_DIR: ${{ env.PROJECT_DIR }}"
          echo "IMAGE_TAG: ${{ env.IMAGE_TAG }}"

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: 2201.13.1

      - name: Cache Ballerina Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.ballerina
          key: ballerina-deps-${{ hashFiles('mock_backends/customer_mock_backend/Ballerina.toml') }}
          restore-keys: |
            ballerina-deps-

      - name: Build Ballerina Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: bal build

      - name: 🔐 Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------------------------------------------------------
      # Push the image that Ballerina built (tag comes from Cloud.toml).
      # IMAGE_TAG env var must match Cloud.toml [container.image].tag.
      # -----------------------------------------------------------------------
      - name: 📦 Push Docker Image
        run: |
          IMAGE_NAME="ramilu90/mock_backend:${{ env.IMAGE_TAG }}"
          echo "Pushing image: ${IMAGE_NAME}"
          docker push "${IMAGE_NAME}"

      # -----------------------------------------------------------------------
      # AKS authentication – must happen before any kubectl commands
      # -----------------------------------------------------------------------
      - name: 🔐 Azure Login via Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: 🚢 Set AKS Kubectl Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: 🚀 Ensure Namespace Exists
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          kubectl get namespace ${NAMESPACE}

      # -----------------------------------------------------------------------
      # ConfigMap – single [ballerinax.wso2.apim.catalog] block
      # -----------------------------------------------------------------------
      - name: Create ConfigMap
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"
          cat <<EOF > configmap.yaml
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ballerina-values-customer-mock-backends
            namespace: $NAMESPACE
          data:
            BAL_CONFIG_DATA: |
              # [ballerina.observe]
              # tracingEnabled=true
              # tracingProvider="moesif"
              # metricsEnabled=true
              # metricsReporter="moesif"

              # [ballerinax.moesif]
              # applicationId = "${{ secrets.MOESIF_APPID }}"
              # reporterBaseUrl = "https://api.moesif.net"
              # tracingReporterFlushInterval = 1000
              # tracingReporterBufferSize = 10000
              # isTraceLoggingEnabled = false
              # isPayloadLoggingEnabled = false

              # [ballerinax.wso2.controlplane.dashboard]
              # url="https://cloud-icp.icp.svc.cluster.local:9743/dashboard/api"
              # heartbeatInterval=10
              # groupId="cluster1"
              # mgtApiUrl="https://mock-backends.ballerina.svc.cluster.local:9264/management/"
              # nodeId="orchestration_and_email_sms"

              # [ballerinax.wso2.apim.catalog]
              # serviceUrl="https://acp-wso2am-acp-service.apim-cp.svc.cluster.local:9443/api/am/service-catalog/v1"
              # tokenUrl="https://acp-wso2am-acp-service.apim-cp.svc.cluster.local:9443/oauth2/token"
              # username="${{ secrets.APIM_USERNAME }}"
              # password="${{ secrets.APIM_PASSWORD }}"
              # clientId="${{ secrets.APIM_SERV_CATALOG_CLIENT_ID }}"
              # clientSecret="${{ secrets.APIM_SERV_CATALOG_CLIENT_SECRET }}"
          EOF

          echo "Applying ConfigMap..."
          kubectl apply -f configmap.yaml

      - name: 🔍 Debug - Check K8s Artifacts Directory
        run: |
          K8S_ARTIFACTS_DIR="${{ env.PROJECT_DIR }}/target/kubernetes/mock_backends"
          if [ -d "${K8S_ARTIFACTS_DIR}" ]; then
            echo "${K8S_ARTIFACTS_DIR} directory exists. Contents:"
            ls -la ${K8S_ARTIFACTS_DIR}
          else
            echo "Error: ${K8S_ARTIFACTS_DIR} does NOT exist after build."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Deploy: delete stale resources first, then apply fresh (matches vies pattern)
      # -----------------------------------------------------------------------
      - name: Deploy Kubernetes Resources
        run: |
          K8S_DIR="${{ env.PROJECT_DIR }}/target/kubernetes/mock_backends"

          echo "Deleting existing resources from ${K8S_DIR}..."
          kubectl delete -f ${K8S_DIR} -n ${{ env.BALLERINA_NAMESPACE }} --ignore-not-found=true

          echo "Applying new resources from ${K8S_DIR}..."
          kubectl apply -f ${K8S_DIR} -n ${{ env.BALLERINA_NAMESPACE }}

      # -----------------------------------------------------------------------
      # Service: the Ballerina-generated YAML contains no Service resource.
      # Apply a complete Service definition covering all listener ports.
      #
      # Ports exposed by customer_mock_backend:
      #   9091 – Cash Registry  (mock_backend.bal  – cashRegistryListener)
      #   9092 – OAS / Master DB (mock_backend.bal  – oasListener)
      #   9093 – SOAP           (mock_backend.bal  – soapListener)
      #   9094 – Employee       (mock_backend2.bal – employeeListener)
      #   9096 – Notification   (mock_backend.bal  – notificationListener)
      #   9264 – Ballerina management API
      # -----------------------------------------------------------------------
      - name: Ensure Service & Patch Ports
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"

          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Service
          metadata:
            name: mock-backends
            namespace: ${NAMESPACE}
            labels:
              app: mock_backends
          spec:
            type: ClusterIP
            selector:
              app: mock_backends
            ports:
              - name: cashregistry
                port: 9091
                targetPort: 9091
                protocol: TCP
              - name: oas
                port: 9092
                targetPort: 9092
                protocol: TCP
              - name: soap
                port: 9093
                targetPort: 9093
                protocol: TCP
              - name: employee
                port: 9094
                targetPort: 9094
                protocol: TCP
              - name: notification
                port: 9096
                targetPort: 9096
                protocol: TCP
              - name: management
                port: 9264
                targetPort: 9264
                protocol: TCP
          EOF

          echo "Service applied. Current state:"
          kubectl get svc mock-backends -n ${NAMESPACE} -o wide

      - name: Patch Deployment (Volume Mounts & Env)
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"
          DEPLOYMENT="mock-backends-deployment"

          CONTAINER_NAME=$(kubectl get deployment $DEPLOYMENT -n $NAMESPACE -o jsonpath='{.spec.template.spec.containers[0].name}')
          echo "Patching Deployment $DEPLOYMENT (Container: $CONTAINER_NAME)..."

          kubectl patch deployment $DEPLOYMENT -n $NAMESPACE --patch "
          spec:
            replicas: 1
            template:
              spec:
                volumes:
                - name: keystore-vol
                  secret:
                    secretName: ballerina-integration-secret
                containers:
                - name: $CONTAINER_NAME
                  envFrom:
                  - configMapRef:
                      name: ballerina-values-customer-mock-backends
                  volumeMounts:
                  - name: keystore-vol
                    mountPath: /home/ballerina/bre/security
                    readOnly: true
          "

          # Restart to pick up latest ConfigMap and volume mounts
          kubectl rollout restart deployment/$DEPLOYMENT -n $NAMESPACE

          echo "Waiting for successful rollout..."
          kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=120s
