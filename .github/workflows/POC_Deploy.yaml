name: Integration - POC Service CI/CD

on:
  push:
    paths:
      - 'apim-integration-artefacts-for-cicd-pipeline/integration/TEST/poc_deployment/**'
      - '.github/workflows/POC_Deploy.yaml'
    branches:
      - POC
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
      BALLERINA_NAMESPACE: ballerina
      PROJECT_DIR: apim-integration-artefacts-for-cicd-pipeline/integration/TEST/poc_deployment
      IMAGE_TAG: "1.0.69"
      ENV_FILE: "dev.env"   # change to test.env or prod.env as needed

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Debug - Print Environment Variables
        run: |
          echo "PROJECT_DIR: ${{ env.PROJECT_DIR }}"
          echo "IMAGE_TAG: ${{ env.IMAGE_TAG }}"
          echo "ENV_FILE: ${{ env.ENV_FILE }}"

      - name: Copy Environment File
        run: |
          cp "${{ env.PROJECT_DIR }}/${{ env.ENV_FILE }}" "${{ env.PROJECT_DIR }}/.env"
          echo ".env file copied for Ballerina build"

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: 2201.13.1

      - name: Cache Ballerina Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.ballerina
          key: ballerina-deps-${{ hashFiles('${{ env.PROJECT_DIR }}/Ballerina.toml') }}
          restore-keys: |
            ballerina-deps-

      - name: Build Ballerina Project with .env
        working-directory: ${{ env.PROJECT_DIR }}
        run: bal build --cloud k8s --cloud-config .env

      - name: 🐳 List local Docker images
        run: docker images

      - name: 🔐 Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📦 Push Docker Image
        run: |
          IMAGE_NAME="ramilu90/poc_deployment:${{ env.IMAGE_TAG }}"
          docker push "$IMAGE_NAME"

      - name: 🔐 Azure Login via Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: 🚢 Set AKS Kubectl Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: 🚀 Ensure Namespace Exists
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          kubectl get namespace ${NAMESPACE}

      - name: 🔍 Debug - Check K8s Artifacts Directory
        run: |
          K8S_ARTIFACTS_DIR="${{ env.PROJECT_DIR }}/target/kubernetes/poc_deployment"
          if [ -d "${K8S_ARTIFACTS_DIR}" ]; then
            echo "${K8S_ARTIFACTS_DIR} directory exists. Contents:"
            ls -la ${K8S_ARTIFACTS_DIR}
          else
            echo "Error: ${K8S_ARTIFACTS_DIR} does NOT exist after build."
            exit 1
          fi

      - name: Deploy Kubernetes Resources
        run: |
          K8S_DIR="${{ env.PROJECT_DIR }}/target/kubernetes/poc_deployment"
          echo "Deleting existing resources from ${K8S_DIR}..."
          kubectl delete -f ${K8S_DIR} -n ${{ env.BALLERINA_NAMESPACE }} --ignore-not-found=true
          echo "Applying new resources from ${K8S_DIR}..."
          kubectl apply -f ${K8S_DIR} -n ${{ env.BALLERINA_NAMESPACE }}

      - name: Ensure Service & Patch Ports
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Service
          metadata:
            name: poc-deployment
            namespace: ${NAMESPACE}
            labels:
              app: poc_deployment
          spec:
            type: ClusterIP
            selector:
              app: poc_deployment
            ports:
              - name: http
                port: 9090
                targetPort: 9090
          EOF
          kubectl get svc poc-deployment -n ${NAMESPACE} -o wide