name: Integration - POC Service CI/CD

on:
  push:
    paths:
      - 'apim-integration-artefacts-for-cicd-pipeline/integration/TEST/poc_deployment/**'
      - '.github/workflows/POC_Deploy.yaml'
    branches:
      - POC
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
      BALLERINA_NAMESPACE: ballerina
      PROJECT_DIR: apim-integration-artefacts-for-cicd-pipeline/integration/TEST/poc_deployment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Extract IMAGE_TAG from Cloud.toml
        id: get_tag
        run: |
          IMAGE_TAG=$(grep 'tag =' ${{ env.PROJECT_DIR }}/Cloud.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Print IMAGE_TAG
        run: echo "The image tag is $IMAGE_TAG"

      - name: Check if Cloud.toml was changed
        run: |
          # Get the list of changed files between the previous and current commit
          changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          echo "Changed files:"
          echo "$changed_files"

          # Check if Cloud.toml in PROJECT_DIR is among changed files
          if echo "$changed_files" | grep -q "${{ env.PROJECT_DIR }}/Cloud.toml"; then
            echo "Cloud.toml changed. Continuing workflow."
          else
            echo "ERROR: Cloud.toml was not changed. IMAGE_TAG may not have been updated."
            exit 1
          fi

      - name: ⚙️ Debug - Print Environment Variables
        run: |
          echo "PROJECT_DIR: ${{ env.PROJECT_DIR }}"
          echo "IMAGE_TAG: ${{ env.IMAGE_TAG }}"

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: 2201.13.1

      - name: Cache Ballerina Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.ballerina
          key: ballerina-deps-${{ hashFiles('${{ env.PROJECT_DIR }}/Ballerina.toml') }}
          restore-keys: |
            ballerina-deps-

      - name: Build Ballerina Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: bal build --cloud k8s

      - name: 🐳 List local Docker images
        run: docker images

      - name: 🔐 Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📦 Push Docker Image
        run: |
          IMAGE_NAME="ramilu90/poc_deployment:${{ env.IMAGE_TAG }}"
          docker push "$IMAGE_NAME"

      - name: 🔐 Azure Login via Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: 🚢 Set AKS Kubectl Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: 🚀 Ensure Namespace Exists
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          kubectl get namespace ${NAMESPACE}

      - name: Create ConfigMap
        env:
          CONFIGMAP_YAML: ${{ secrets.POC_CONFIGMAP_YAML }}
        run: |
          printf '%s\n' "$CONFIGMAP_YAML" \
            | sed "s|__NAMESPACE__|${{ env.BALLERINA_NAMESPACE }}|g" \
            | kubectl apply -n ${{ env.BALLERINA_NAMESPACE }} -f -

      - name: 🔍 Debug - Check K8s Artifacts Directory
        run: |
          K8S_ARTIFACTS_DIR="${{ env.PROJECT_DIR }}/target/kubernetes/poc_deployment"
          if [ -d "${K8S_ARTIFACTS_DIR}" ]; then
            echo "${K8S_ARTIFACTS_DIR} directory exists. Contents:"
            ls -la ${K8S_ARTIFACTS_DIR}
          else
            echo "Error: ${K8S_ARTIFACTS_DIR} does NOT exist after build."
            exit 1
          fi

      - name: Deploy Kubernetes Resources
        run: |
          K8S_DIR="${{ env.PROJECT_DIR }}/target/kubernetes/poc_deployment"
          echo "Deleting existing resources from ${K8S_DIR}..."
          kubectl delete -f ${K8S_DIR} -n ${{ env.BALLERINA_NAMESPACE }} --ignore-not-found=true
          echo "Applying new resources from ${K8S_DIR}..."
          kubectl apply -f ${K8S_DIR} -n ${{ env.BALLERINA_NAMESPACE }}

      - name: Ensure Service & Patch Ports
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Service
          metadata:
            name: poc-deployment
            namespace: ${NAMESPACE}
            labels:
              app: poc_deployment
          spec:
            type: ClusterIP
            selector:
              app: poc_deployment
            ports:
              - name: http
                port: 9090
                targetPort: 9090
          EOF
          kubectl get svc poc-deployment -n ${NAMESPACE} -o wide

      - name: Patch Deployment (Inject ENVIRONMENT from ConfigMap)
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"

          # Find the deployment dynamically by label
          DEPLOYMENT=$(kubectl get deployment -n $NAMESPACE -l app=poc_deployment -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$DEPLOYMENT" ]; then
            echo "Error: No deployment found with label app=poc_deployment in namespace $NAMESPACE"
            exit 1
          fi

          # Get container name
          CONTAINER_NAME=$(kubectl get deployment $DEPLOYMENT -n $NAMESPACE -o jsonpath='{.spec.template.spec.containers[0].name}')
          echo "Patching Deployment $DEPLOYMENT (Container: $CONTAINER_NAME)..."

          # Inject ConfigMap values as individual env vars
          kubectl set env deployment/$DEPLOYMENT \
            --from=configmap/poc-env-config \
            -n $NAMESPACE --overwrite

          # Restart deployment to pick up new ENV
          kubectl rollout restart deployment/$DEPLOYMENT -n $NAMESPACE
          echo "Waiting for successful rollout..."
          kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=180s