name: APIM - Pharmacy Services API Pipeline
on:
  push:
    paths:
      - 'apim-integration-artefacts-for-cicd-pipeline/apim/PharmacyServicesAPI-1.0.0/**'
      - '.github/workflows/pharmacy_api.yml'
    branches:
      - main

jobs:
  deploy-api-prod:
    runs-on: self-hosted
    if: ${{ contains(github.event.head_commit.message, 'prod') || github.event_name == 'push' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: Add etc/hosts entry for cp.wso2.com 🌐
      #   run: |
      #     echo '127.0.0.1 cp.wso2.com' | sudo tee -a /etc/hosts

      - name: Install apictl
        run: |
          wget https://github.com/wso2/product-apim-tooling/releases/download/v4.6.0/apictl-4.6.0-darwin-arm64.tar.gz
          tar -xzf apictl-4.6.0-darwin-arm64.tar.gz
          chmod +x apictl/apictl
          mkdir -p $HOME/.local/bin
          mv apictl/apictl $HOME/.local/bin/apictl
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Check connectivity
        run: |
          echo "Resolving cp.wso2.com..."
          nslookup cp.wso2.com || true
          echo "Pinging cp.wso2.com..."
          curl -sk -o /dev/null -w "HTTP status: %{http_code}\n" https://cp.wso2.com/oauth2/token || echo "curl failed"

      - name: Configure Prod Environment
        run: |
          echo "⚙️ Configuring APIM environment..."

          # Remove 'prod' if it already exists (suppress errors with || true)
          apictl remove env prod --verbose 2>/dev/null || true

          # Add it fresh to ensure the URL is always correct
          apictl add env prod --apim https://cp.wso2.com

      - name: Login to APIM CP
        run: |
          apictl login prod -u admin -p admin --insecure

      - name: Check if API Exists in APIM
        id: check_api
        run: |
          echo "🔍 Checking for existing API..."

          # Capture raw output
          RAW_OUTPUT=$(apictl get apis -e prod -q name:PharmacyServicesAPI --insecure --format json 2>/dev/null)

          echo "-------------- DEBUG: RAW OUTPUT START --------------"
          echo "$RAW_OUTPUT"
          echo "-------------- DEBUG: RAW OUTPUT END ----------------"

          # Strip any preamble lines before the first JSON object
          CLEAN_JSON=$(echo "$RAW_OUTPUT" | sed -n '/^{/,$p')

          # Parse count, defaulting to 0 if null/empty
          EXISTING_API=$(echo "$CLEAN_JSON" | jq -r '.count // 0')

          echo "Parsed Count: $EXISTING_API"

          if [ "$EXISTING_API" -gt "0" ]; then
            echo "✅ API found. A new revision will be created."
            echo "api_exists=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ API not found. A new API will be created."
            echo "api_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Import API to Prod
        run: |
          API_PROJECT_PATH="/Users/ramindu/wso2/general_demo/demo_resources/k8-artefacts-apim-bi-elk/apim-integration-artefacts-for-cicd-pipeline/apim/PharmacyServicesAPI-1.0.0"

          echo "📂 Project Path: $API_PROJECT_PATH"

          if [ -d "$API_PROJECT_PATH" ]; then
            echo "✅ Directory found."
          else
            echo "❌ Directory NOT found at $API_PROJECT_PATH"
            exit 1
          fi

          if [ "${{ steps.check_api.outputs.api_exists }}" == "true" ]; then
            echo "🚀 Updating existing API and creating a new Revision..."
          else
            echo "🆕 Creating fresh API..."
          fi

          apictl import api -f "$API_PROJECT_PATH" -e prod --preserve-provider=false --update --insecure

      - name: Run Tests (Optional)
        run: |
          found=false
          for i in {1..3}; do
            echo "Attempt $i: Checking for PharmacyServicesAPI..."

            if apictl get apis -e prod --insecure | grep -q "PharmacyServicesAPI"; then
              echo "✅ PharmacyServicesAPI is present in Publisher"
              found=true
              break
            fi

            echo "⚠️ API not found yet. Waiting 2 seconds..."
            sleep 2
          done

          if [ "$found" = false ]; then
            echo "❌ PharmacyServicesAPI not found in Publisher (prod) after 3 attempts."
            echo "Available APIs were:"
            apictl get apis -e prod --insecure
            exit 1
          fi
