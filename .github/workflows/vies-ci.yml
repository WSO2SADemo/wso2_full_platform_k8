name: Integration - VIES Integration

on:
  push:
    paths:
      - 'apim-integration-artefacts-for-cicd-pipeline/integration/integrations-1/vies-integration/**'
      - '.github/workflows/vies-ci.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - project_subdir: vies-internal
            docker_repo: "ramilu90/vies_integration_internal"
            config_map_name: "ballerina-values-vies-internal"
            # k8s_artifact_name must match [package].name in Ballerina.toml
            # IMPORTANT: update Ballerina.toml name to "vies_internal" for unique k8s resources
            k8s_artifact_name: "vies_integration_internal"
            service_name: "vies-integration-internal"
            port_name: "vies-int-port"

          - project_subdir: vies2-dmz_internal
            docker_repo: "ramilu90/vies_integration_dmz_internal"
            config_map_name: "ballerina-values-vies-dmz-internal"
            k8s_artifact_name: "vies_integration_dmz_internal"
            service_name: "vies-integration-dmz-internal"
            port_name: "vies-dmz-int-port"

          - project_subdir: vies3-dmz_ext
            docker_repo: "ramilu90/vies_integration_dmz_external"
            config_map_name: "ballerina-values-vies-dmz-external"
            k8s_artifact_name: "vies_integration_dmz_external"
            service_name: "vies-integration-dmz-external"
            port_name: "vies-dmz-ext-port"

    env:
      BALLERINA_NAMESPACE: ballerina
      BASE_DIR: apim-integration-artefacts-for-cicd-pipeline/integration/integrations-1/vies-integration
      IMAGE_TAG: "1.0.1"
      # Absolute path to vies-integration dir on the self-hosted runner
      LOCAL_BASE_PATH: "/Users/ramindu/wso2/general_demo/is_demo_resources/k8-artefacts-apim-bi-elk/apim-integration-artefacts-for-cicd-pipeline/integration/integrations-1/vies-integration"
      # Shared Kafka resources path (common to all projects)
      LOCAL_RES_PATH: "/Users/ramindu/wso2/general_demo/is_demo_resources/k8-artefacts-apim-bi-elk/apim-integration-artefacts-for-cicd-pipeline/integration/integrations-1/vies-integration/resources"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Print Ballerina Version
        run: bal version

      - name: Build Ballerina Project
        working-directory: ${{ env.BASE_DIR }}/${{ matrix.project_subdir }}
        run: bal build

      - name: 🔐 Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Retag and Push Docker Image
        run: |
          BUILT_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "${{ matrix.docker_repo }}" | head -n 1)

          if [ -z "$BUILT_IMAGE" ]; then
            echo "Error: No image found matching '${{ matrix.docker_repo }}'"
            exit 1
          fi

          echo "Found built image: $BUILT_IMAGE"
          TARGET_IMAGE="${{ matrix.docker_repo }}:${{ env.IMAGE_TAG }}"
          docker tag "$BUILT_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"

      - name: Ensure Namespace Exists
        run: kubectl create namespace ${{ env.BALLERINA_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Local ConfigMap
        run: |
          CONFIG_MAP_FILE="${{ env.LOCAL_BASE_PATH }}/${{ matrix.project_subdir }}/config-map-vies.yaml"
          echo "Applying ConfigMap from $CONFIG_MAP_FILE..."
          if [ -f "$CONFIG_MAP_FILE" ]; then
            kubectl apply -f "$CONFIG_MAP_FILE" -n ${{ env.BALLERINA_NAMESPACE }}
          else
            echo "❌ Error: File not found at $CONFIG_MAP_FILE"
            exit 1
          fi

      - name: Ensure Ballerina Keystore Secret Exists
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"
          SECRET_NAME="ballerina-secrets"
          LOCAL_SECRET_PATH="/Users/ramindu/wso2/general_demo/is_demo_resources/k8-artefacts-apim-bi-elk/integration/ballerina-secrets.yaml"

          echo "Checking if secret '$SECRET_NAME' exists in namespace '$NAMESPACE'..."

          if kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" > /dev/null 2>&1; then
            echo "✅ Secret '$SECRET_NAME' already exists. Skipping application."
          else
            echo "⚠️ Secret '$SECRET_NAME' NOT found."

            if [ -f "$LOCAL_SECRET_PATH" ]; then
              echo "Applying from local path: $LOCAL_SECRET_PATH"
              kubectl apply -f "$LOCAL_SECRET_PATH" -n "$NAMESPACE"
            else
              echo "❌ Error: Local secret file not found at $LOCAL_SECRET_PATH"
              exit 1
            fi
          fi

      - name: Create Kafka Resources Secret
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"
          SECRET_NAME="kafka-resources-secret"
          RES_PATH="${{ env.LOCAL_RES_PATH }}"

          echo "Creating/Updating secret '$SECRET_NAME' from '$RES_PATH'..."

          # Check if files exist before creating secret
          if [ ! -d "$RES_PATH" ]; then
             echo "❌ Error: Resources directory not found at $RES_PATH"
             exit 1
          fi

          # Delete existing secret (to ensure updates are applied if files changed)
          kubectl delete secret $SECRET_NAME -n $NAMESPACE --ignore-not-found

          # Create new secret
          kubectl create secret generic $SECRET_NAME \
            --from-file=ca.pem="$RES_PATH/ca.pem" \
            --from-file=service.cert="$RES_PATH/service.cert" \
            --from-file=service.key="$RES_PATH/service.key" \
            -n $NAMESPACE

          echo "✅ Secret '$SECRET_NAME' created successfully."

      - name: Deploy Kubernetes Resources
        run: |
          K8S_DIR="${{ env.BASE_DIR }}/${{ matrix.project_subdir }}/target/kubernetes/${{ matrix.k8s_artifact_name }}"
          echo "Applying resources from $K8S_DIR..."
          kubectl apply -f ${K8S_DIR} -n ${{ env.BALLERINA_NAMESPACE }}

      - name: Ensure Service & Patch Port 8080
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"
          SERVICE_NAME="${{ matrix.service_name }}"
          TARGET_PORT_NAME="${{ matrix.port_name }}"

          echo "Current Deployments in $NAMESPACE:"
          kubectl get deployments -n $NAMESPACE

          # Auto-detect the Deployment Name created by bal build for this project
          # The deployment name is derived from the Ballerina package name
          DEPLOYMENT=$(kubectl get deployments -n $NAMESPACE -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep "${{ matrix.k8s_artifact_name }}" | head -n 1)

          if [ -z "$DEPLOYMENT" ]; then
            echo "❌ Error: Could not find any deployment matching '${{ matrix.k8s_artifact_name }}'"
            exit 1
          fi

          echo "✅ Found Deployment: $DEPLOYMENT"

          # Create Service if missing
          if ! kubectl get svc $SERVICE_NAME -n $NAMESPACE > /dev/null 2>&1; then
             echo "Service $SERVICE_NAME not found. Creating it for $DEPLOYMENT..."
             kubectl expose deployment $DEPLOYMENT -n $NAMESPACE --name=$SERVICE_NAME --port=8080 --target-port=8080 --type=ClusterIP
          fi

          # Patch Port Name
          if kubectl get svc $SERVICE_NAME -n $NAMESPACE -o jsonpath='{.spec.ports[*].port}' | grep -q "\b8080\b"; then
             kubectl patch svc $SERVICE_NAME -n $NAMESPACE --type='strategic' -p='{"spec":{"ports":[{"port":8080,"name":"'"$TARGET_PORT_NAME"'"}]}}'
          else
             kubectl patch svc $SERVICE_NAME -n $NAMESPACE --type='json' -p='[{"op": "add", "path": "/spec/ports/-", "value": {"name": "'"$TARGET_PORT_NAME"'", "port": 8080, "targetPort": 8080, "protocol": "TCP"}}]'
          fi

          # Export DEPLOYMENT name for the next step
          echo "DEPLOYMENT_NAME=$DEPLOYMENT" >> $GITHUB_ENV

      - name: Patch Deployment (Volume Mounts & Env)
        run: |
          NAMESPACE="${{ env.BALLERINA_NAMESPACE }}"
          DEPLOYMENT="${{ env.DEPLOYMENT_NAME }}"
          CONFIG_MAP_NAME="${{ matrix.config_map_name }}"

          # Secret Names
          KEYSTORE_SECRET="ballerina-secrets"
          KAFKA_SECRET="kafka-resources-secret"

          echo "Patching Deployment: $DEPLOYMENT"
          echo "Using ConfigMap: $CONFIG_MAP_NAME"
          echo "Using Secrets: $KEYSTORE_SECRET and $KAFKA_SECRET"

          CONTAINER_NAME=$(kubectl get deployment $DEPLOYMENT -n $NAMESPACE -o jsonpath='{.spec.template.spec.containers[0].name}')

          kubectl patch deployment $DEPLOYMENT -n $NAMESPACE --patch "
          spec:
            template:
              spec:
                volumes:
                - name: keystore-vol
                  secret:
                    secretName: $KEYSTORE_SECRET
                - name: kafka-vol
                  secret:
                    secretName: $KAFKA_SECRET
                containers:
                - name: $CONTAINER_NAME
                  envFrom:
                  - configMapRef:
                      name: $CONFIG_MAP_NAME
                  volumeMounts:
                  - name: keystore-vol
                    mountPath: /home/ballerina/bre/security
                    readOnly: true
                  - name: kafka-vol
                    mountPath: /home/ballerina/resources
                    readOnly: true
          "

          kubectl rollout restart deployment/$DEPLOYMENT -n $NAMESPACE
          kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=120s
