apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app: otel-collector
spec:
  type: {{ .Values.service.type }}
  selector:
    app: otel-collector
  ports:
    - name: grpc
      port: {{ .Values.service.ports.grpc }}
      targetPort: grpc
      protocol: TCP
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
    - name: zpages
      port: {{ .Values.service.ports.zpages }}
      targetPort: zpages
      protocol: TCP
