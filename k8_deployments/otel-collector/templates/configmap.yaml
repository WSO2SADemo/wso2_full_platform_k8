apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317

    exporters:
      debug:
        verbosity: detailed
      otlphttp/moesif:
        endpoint: "https://api.moesif.net"
        compression: none
        encoding: json
        headers:
          X-Moesif-Application-Id: "${env:MOESIF_KEY_ENV_VAR}"

    processors:
      transform:
        trace_statements:
          - context: span
            statements:
              - set(attributes["http.method"], "GET")
              - set(attributes["http.url"], "/menu")
              - set(attributes["http.status_code"], "200")

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [transform]
          exporters: [debug, otlphttp/moesif]
