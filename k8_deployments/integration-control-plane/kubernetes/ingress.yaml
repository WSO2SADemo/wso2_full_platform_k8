apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: icp-ingress
  namespace: icp
  annotations:
    # ICP pod speaks HTTPS only — Nginx Ingress re-encrypts (does not verify cert)
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - icp.wso2.com
      secretName: icp-tls
  rules:
    - host: icp.wso2.com
      http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: icp-service
                port:
                  number: 9446
          - path: /icp/observability
            pathType: Prefix
            backend:
              service:
                name: icp-service
                port:
                  number: 9448
          - path: /
            pathType: Prefix
            backend:
              service:
                name: icp-service
                port:
                  number: 9445
