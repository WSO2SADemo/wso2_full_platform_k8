# ===============================================================
# APK 1.3.0 Optimized Configuration (apk-min.yaml)
# Fixes: Cert-Manager, IDP Trust, and Multi-Gateway Coexistence
# ===============================================================

wso2:
  apk:
    webhooks:
      validatingwebhookconfigurations: false
      mutatingwebhookconfigurations: false
      conversionwebhookconfigurations: false
    auth:
      enabled: true
      enableServiceAccountCreation: true
      enableClusterRoleCreation: true
      serviceAccountName: wso2apk-platform
      roleName: wso2apk-role
    listener:
      hostname: "kgw.wso2.com"
      port: 9095
    idp:
      issuer: "https://is.wso2.com/oauth2/token"
      usernameClaim: "sub"
      organizationClaim: "organization"
      groupsClaim: "groups"
      consumerKeyClaim: "clientId"
      organizationResolver: "controlPlane"
      tls:
        secretName: "wso2apk-idp-certificates"
        fileName: "idp.crt"
      signing:
        jwksEndpoint: "https://is.wso2.com/oauth2/jwks"
        secretName: "wso2apk-idp-certificates"
        fileName: "idp.crt"
    cp:
      enabledSubscription: true
      host: "apim-apk-agent-service.apim-kgw.svc.cluster.local"
      skipSSLVerification: true
      persistence:
        type: "K8s"
    dp:
      enabled: true
      gateway:
        listener:
          hostname: "kgw.wso2.com"
      configdeployer:
        enabled: true
        deployment:
          replicas: 1
          imagePullPolicy: Always
          image: wso2/apk-config-deployer-service:1.3.0
      adapter:
        deployment:
          replicas: 1
          imagePullPolicy: Always
          image: wso2/apk-adapter:1.3.0
          logging:
            level: "DEBUG"
        configs:
          enableGatewayClassController: false
          apiNamespaces:
            - "apim-kgw"
      commonController:
        deployment:
          replicas: 1
          imagePullPolicy: Always
          image: wso2/apk-common-controller:1.3.0
      ratelimiter:
        enabled: true
        deployment:
          replicas: 1
          imagePullPolicy: Always
          image: wso2/apk-ratelimiter:1.3.0
      gatewayRuntime:
        deployment:
          replicas: 1
          router:
            imagePullPolicy: Always
            image: wso2/apk-router:1.3.0
          enforcer:
            imagePullPolicy: Always
            image: wso2/apk-enforcer:1.3.0
            env:
              TOKEN_REVOCATION_ENABLED: "true"
              LOG_LEVEL: "DEBUG"
            configs:
              grpc:
                keepAliveTime: 30s
                keepAliveTimeout: 10s
                permitWithoutStream: true
              apiKey:
                enabled: false

idp:
  enabled: false # External IS is being used

gatewaySystem:
  enabled: true
  enableServiceAccountCreation: true
  enableClusterRoleCreation: true
  serviceAccountName: gateway-api-admission
  applyGatewayWehbhookJobs: true
  deployment:
    image: registry.k8s.io/gateway-api/admission-server:v1.0.0
    imagePullPolicy: Always

certmanager:
  enabled: true
  enableClusterIssuer: true
  enableRootCa: true
  rootCaSecretName: "apk-root-certificate"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
  containerSecurityContext:
    runAsUser: 1001

postgresql:
  enabled: false 

redis:
  enabled: true
  architecture: standalone
  fullnameOverride: redis
  auth:
    enabled: false

global:
  security:
    allowInsecureImages: true