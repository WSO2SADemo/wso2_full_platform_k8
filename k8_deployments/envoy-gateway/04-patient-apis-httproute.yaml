# All 4 patient service paths routed to medical-patient-services:9201 (ballerina namespace)
# Paths forwarded as-is — no prefix stripping
# Backends: patient_services.bal on port 9201
#   /patients      → Patient Registry
#   /appointments  → Appointments
#   /prescriptions → Prescriptions
#   /labs          → Lab Results
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: patient-apis
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "envoygw.wso2.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/patients"
      backendRefs:
        - name: medical-patient-services
          namespace: ballerina
          port: 9201
    - matches:
        - path:
            type: PathPrefix
            value: "/appointments"
      backendRefs:
        - name: medical-patient-services
          namespace: ballerina
          port: 9201
    - matches:
        - path:
            type: PathPrefix
            value: "/prescriptions"
      backendRefs:
        - name: medical-patient-services
          namespace: ballerina
          port: 9201
    - matches:
        - path:
            type: PathPrefix
            value: "/labs"
      backendRefs:
        - name: medical-patient-services
          namespace: ballerina
          port: 9201
